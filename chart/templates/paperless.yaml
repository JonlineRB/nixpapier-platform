apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-paperless
  labels:
    app: {{ .Release.Name }}
    component: paperless
spec:
  selector:
    app: {{ .Release.Name }}
    component: paperless
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-paperless
  labels:
    app: {{ .Release.Name }}
    component: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: paperless
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: paperless
    spec:
      {{- if .Values.restore.fromBackup }}
      initContainers:
        - name: restore-media
          image: {{ .Values.backup.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- if .Values.backup.healthcheck.enabled }}
              on_exit() {
                rc=$?
                if [ "$rc" -ne 0 ] && [ -n "${HC_RESTORE_UUID:-}" ]; then
                  curl -fsS -m 10 --retry 3 "https://hc-ping.com/${HC_RESTORE_UUID}/fail" >/dev/null || true
                fi
              }
              trap on_exit EXIT
              {{- end }}
              if [ -f /usr/src/paperless/media/.restore-complete ]; then
                echo "Media already restored, skipping."
              else
                . /usr/local/bin/restic-env.sh
                restic restore {{ .Values.restore.snapshot }} --tag media --target /
                touch /usr/src/paperless/media/.restore-complete
              fi
          env:
            {{- include "nixpapier.backupEnv" . | nindent 12 }}
            {{- if .Values.backup.healthcheck.enabled }}
            - name: HC_RESTORE_UUID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-restic-creds
                  key: healthcheck-restore-uuid
                  optional: true
            {{- end }}
          volumeMounts:
            - name: media
              mountPath: /usr/src/paperless/media
            - name: ssh-key
              mountPath: /keys
              readOnly: true
      {{- end }}
      containers:
        - name: paperless
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PAPERLESS_REDIS
              value: "redis://{{ .Release.Name }}-redis:6379"
            - name: PAPERLESS_DBHOST
              value: "{{ .Release.Name }}-postgres"
            - name: PAPERLESS_DBNAME
              value: {{ .Values.postgres.database | quote }}
            - name: PAPERLESS_DBUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                    name: {{ .Release.Name }}-secrets
                    key: postgres-password
            - name: PAPERLESS_URL
              value: "https://{{ .Values.subdomain }}.{{ .Values.baseDomain }}"
            - name: SEED_PROFILE
              value: {{ .Values.seed.profile | quote }}
            - name: PAPERLESS_ADMIN_USER
              value: "admin"
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                    name: {{ .Release.Name }}-secrets
                    key: admin-password
            - name: PAPERLESS_ADMIN_MAIL
              value: {{ .Values.admin.email | quote }}
            - name: PAPERLESS_TIME_ZONE
              value: "Europe/Berlin"
            - name: PAPERLESS_OCR_LANGUAGE
              value: "deu+eng"
          volumeMounts:
            - name: media
              mountPath: /usr/src/paperless/media
            - name: data
              mountPath: /usr/src/paperless/data
          startupProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            periodSeconds: 15
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-media
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.restore.fromBackup }}
        - name: ssh-key
          secret:
            secretName: {{ .Release.Name }}-restic-creds
            items:
              - key: ssh-key
                path: ssh-key
                mode: 0600
        {{- end }}
