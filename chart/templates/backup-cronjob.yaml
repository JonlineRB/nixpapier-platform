{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app: {{ .Release.Name }}
    component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}
            component: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -Eeuo pipefail

                  {{- if .Values.backup.healthcheck.enabled }}
                  HC_BASE="https://hc-ping.com/${HC_UUID}"
                  notify_fail() { curl -fsS -m 10 --retry 3 "$HC_BASE/fail" >/dev/null || true; }
                  trap notify_fail ERR
                  curl -fsS -m 10 --retry 3 "$HC_BASE/start" >/dev/null || true
                  {{- end }}

                  . /usr/local/bin/restic-env.sh

                  echo "[backup] dumping postgres..."
                  pg_dump -h {{ .Release.Name }}-postgres -U {{ .Values.postgres.user }} {{ .Values.postgres.database }} > /tmp/dump.sql

                  echo "[backup] backing up postgres dump..."
                  restic backup /tmp/dump.sql --tag postgres

                  echo "[backup] backing up media..."
                  restic backup /usr/src/paperless/media --tag media

                  echo "[backup] pruning old snapshots..."
                  restic forget --tag postgres \
                    --keep-daily {{ .Values.backup.retention.daily }} \
                    --keep-weekly {{ .Values.backup.retention.weekly }} \
                    --keep-monthly {{ .Values.backup.retention.monthly }} --prune
                  restic forget --tag media \
                    --keep-daily {{ .Values.backup.retention.daily }} \
                    --keep-weekly {{ .Values.backup.retention.weekly }} \
                    --keep-monthly {{ .Values.backup.retention.monthly }} --prune

                  echo "[backup] done."
                  {{- if .Values.backup.healthcheck.enabled }}
                  curl -fsS -m 10 --retry 3 "$HC_BASE" >/dev/null || true
                  {{- end }}
              env:
                {{- include "nixpapier.backupEnv" . | nindent 16 }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: postgres-password
                {{- if .Values.backup.healthcheck.enabled }}
                - name: HC_UUID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-restic-creds
                      key: healthcheck-uuid
                {{- end }}
              volumeMounts:
                - name: media
                  mountPath: /usr/src/paperless/media
                  readOnly: true
                - name: ssh-key
                  mountPath: /keys
                  readOnly: true
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-media
            - name: ssh-key
              secret:
                secretName: {{ .Release.Name }}-restic-creds
                items:
                  - key: ssh-key
                    path: ssh-key
                    mode: 0600
{{- end }}
