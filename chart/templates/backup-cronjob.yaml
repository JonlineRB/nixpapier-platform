{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app: {{ .Release.Name }}
    component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}
            component: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: ["/usr/local/bin/backup.sh"]
              env:
                {{- include "nixpapier.backupEnv" . | nindent 16 }}
                - name: PGHOST
                  value: {{ .Release.Name }}-postgres
                - name: PGUSER
                  value: {{ .Values.postgres.user | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: postgres-password
                - name: KEEP_DAILY
                  value: {{ .Values.backup.retention.daily | quote }}
                - name: KEEP_WEEKLY
                  value: {{ .Values.backup.retention.weekly | quote }}
                - name: KEEP_MONTHLY
                  value: {{ .Values.backup.retention.monthly | quote }}
                {{- if .Values.backup.healthcheck.enabled }}
                - name: HC_UUID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-restic-creds
                      key: healthcheck-uuid
                {{- end }}
              volumeMounts:
                - name: media
                  mountPath: /usr/src/paperless/media
                  readOnly: true
                - name: ssh-key
                  mountPath: /keys
                  readOnly: true
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-media
            - name: ssh-key
              secret:
                secretName: {{ .Release.Name }}-restic-creds
                items:
                  - key: ssh-key
                    path: ssh-key
                    mode: 0600
{{- end }}
