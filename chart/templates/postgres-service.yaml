apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}
    component: postgres
spec:
  clusterIP: None          # headless — StatefulSets want this
  selector:
    app: {{ .Release.Name }}
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
